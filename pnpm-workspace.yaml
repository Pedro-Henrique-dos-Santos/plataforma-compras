packages:
  - apps/*
  - packages/*

overrides:
  effect: 3.20.0

onlyBuiltDependencies:
  - '@prisma/client'
  - '@prisma/engines'
  - esbuild
  - prisma
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  '@scarf/scarf': set this to true or false
  esbuild: true
  prisma: true
  tesseract.js: false
