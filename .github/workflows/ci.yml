name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compras?schema=public
      DATABASE_ADMIN_URL: postgresql://postgres:postgres@127.0.0.1:5432/compras
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: compras
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate database client
        run: pnpm db:generate

      - name: Validate database schema
        run: pnpm db:validate

      - name: Prepare Supabase-compatible database roles
        run: |
          # Supabase provides these roles; the disposable PostgreSQL service does not.
          psql "$DATABASE_ADMIN_URL" --set ON_ERROR_STOP=1 \
            --command "CREATE ROLE anon NOLOGIN NOINHERIT" \
            --command "CREATE ROLE authenticated NOLOGIN NOINHERIT"

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Verify deployed database protections
        run: pnpm db:verify:deployed

      - name: Validate workspace
        run: pnpm check

      - name: Validate PostgreSQL tenant isolation
        run: pnpm test:integration

      - name: Verify PostgreSQL client tools
        run: |
          pg_dump --version
          pg_restore --version
          psql --version
          createdb --version
          dropdb --version

      - name: Seed synthetic recovery fixture
        run: pnpm db:seed

      - name: Run backup and restore drill
        env:
          RESTORE_DRILL_REQUIRE_DATA: "true"
        run: pnpm db:restore:drill

