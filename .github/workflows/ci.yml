name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - "agent/**"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/compras?schema=public
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: compras
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d compras"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate database client
        run: pnpm db:generate

      - name: Validate database schema
        run: pnpm db:validate

      - name: Apply database migrations
        run: pnpm db:deploy

      - name: Verify deployed database protections
        run: pnpm db:verify:deployed

      - name: Validate workspace
        run: pnpm check

      - name: Validate PostgreSQL tenant isolation
        run: pnpm test:integration

      - name: Verify PostgreSQL client tools
        run: |
          pg_dump --version
          pg_restore --version
          psql --version
          createdb --version
          dropdb --version

      - name: Seed synthetic recovery fixture
        run: pnpm db:seed

      - name: Run backup and restore drill
        env:
          RESTORE_DRILL_REQUIRE_DATA: "true"
        run: pnpm db:restore:drill

