name: Supabase Staging

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: Digite APLICAR HOMOLOGACAO para liberar as migracoes
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-staging-database
  cancel-in-progress: false

jobs:
  migrate-and-verify:
    name: Migrate and verify staging
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_URL: ${{ secrets.STAGING_DATABASE_URL }}
      INVOICE_STORAGE_BUCKET: invoice-documents
      SUPABASE_SECRET_KEY: ${{ secrets.STAGING_SUPABASE_SECRET_KEY }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
    steps:
      - name: Confirm staging operation
        env:
          CONFIRMATION: ${{ inputs.confirmation }}
        run: test "$CONFIRMATION" = "APLICAR HOMOLOGACAO"

      - name: Validate required secrets
        run: |
          test -n "$DATABASE_URL"
          test -n "$SUPABASE_URL"
          test -n "${SUPABASE_SECRET_KEY:-$SUPABASE_SERVICE_ROLE_KEY}"

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate database client
        run: pnpm db:generate

      - name: Validate database schema
        run: pnpm db:validate

      - name: Apply staging migrations
        run: pnpm db:deploy

      - name: Verify deployed database protections
        run: pnpm db:verify:deployed

      - name: Validate staging tenant isolation
        run: pnpm test:integration

      - name: Provision private invoice bucket
        run: pnpm supabase:bootstrap
